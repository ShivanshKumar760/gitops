apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: code-exec
type: Opaque
stringData:
  POSTGRES_USER: codeexec
  POSTGRES_PASSWORD: change-me-to-something-real   # never commit a real password — see Section 28's note
  POSTGRES_DB: codeexec
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: code-exec
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: gp3
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: code-exec
spec:
  replicas: 1
  strategy:
    type: Recreate   # REQUIRED for a ReadWriteOnce volume — see the callout below
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          envFrom:
            - secretRef: { name: postgres-credentials }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata   # avoids Postgres refusing to start on a non-empty root dir (EBS adds lost+found)
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "codeexec"] }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: code-exec
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]