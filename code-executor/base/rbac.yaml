apiVersion: v1
kind: ServiceAccount
metadata:
  name: code-executor-api
  namespace: code-exec
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-executor
  namespace: code-exec
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-executor-binding
  namespace: code-exec
subjects:
  - kind: ServiceAccount
    name: code-executor-api
    namespace: code-exec
roleRef:
  kind: Role
  name: pod-executor
  apiGroup: rbac.authorization.k8s.io