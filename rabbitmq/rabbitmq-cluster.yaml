apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: hello-rabbit
  namespace: hello
spec:
  replicas: 1
  persistence:
    storageClassName: gp3
    storage: 5Gi
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: "1", memory: 1Gi }