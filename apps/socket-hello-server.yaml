apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: socket-hello-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ShivanshKumar760/gitops.git
    targetRevision: main
    path: socket-hello-server/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: hello
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true